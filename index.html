<!DOCTYPE html>

<head>

    <style>
        /* iOS Safari enlarges text in landscape unless told not to; that pushed 析 into a second column */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        @font-face { font-family: 'LXGW WenKai Art'; src: url('fonts/lxgw-wenkai-art.woff2') format('woff2'); font-display: swap; }
        @font-face { font-family: 'Optima Fallback'; src: url('fonts/marcellus-latin-400-normal.woff2') format('woff2'); font-display: swap; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        /* The photo as it is: whole, uncropped, no fade; the rest of the screen left blank, as when viewing the photos later */
        body { background: #fdfdfd; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 40px 64px; }
        .photo { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; user-select: none; -webkit-user-drag: none; }
        @media (max-width: 600px) { body { padding: 40px 12px; } }
        /* No overlay: the two choices simply appear in white on the photo, centred on it */
        .choose { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
                  opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility .6s; cursor: default; }
        .chosen .choose { opacity: 1; visibility: visible; }
        .choose a { color: #fff; text-decoration: none; font-size: 16px; letter-spacing: .3em; padding: 10px 4px; border-bottom: 1px solid transparent; transition: border-color .2s;
                    text-shadow: 0 0 14px rgba(0,0,0,.7), 0 0 4px rgba(0,0,0,.55); } /* a soft halo keeps the white words legible on lighter photos */
        .choose a:hover, .choose a:focus-visible { border-bottom-color: #fff; outline: none; }
        .choose .en { font-family: 'Optima nova', Optima, 'Optima Fallback', serif; text-transform: uppercase; }
        .choose .zh { font-family: 'LXGW WenKai Art', 'Kaiti SC', 'STKaiti', serif; font-size: 17px; }
    </style>
</head>
<body>
    <img class="photo" id="photo" alt="">
    <script>

        (function () {
            var photos = [

                ["dr-20250811.jpg", 2000, 1125, "Street market"],
                ["highway.jpg", 1078, 1440, "Black-and-white: a highway interchange curving through trees"],
                ["incircles.jpg", 2000, 1501, "Black-and-white: a band playing outdoors under trees"],
                ["la.jpg", 1212, 682, "Black-and-white: curved steel walls of a concert hall and a lamppost"],
                ["met-shades.jpg", 1440, 1080, "Shade over a stone building"],
                ["motion.jpg", 2000, 1125, "players and passengers"],
                ["new-york-wtc-lines.jpg", 666, 1182, "Black-and-white: the white ribs of the Oculus over a lone figure"],
                ["new-york-wtc.jpg", 360, 640, "Black-and-white: the ribs of the Oculus with flags"],

            try { last = localStorage.getItem('art-splash'); } catch (e) {}
            if (!last) {
                i = 0; // first visit: always the birds on the branches
            } else {
                do { i = Math.floor(Math.random() * photos.length); } while (photos.length > 1 && photos[i][0] === last);
            }
            try { localStorage.setItem('art-splash', photos[i][0]); } catch (e) {}
            var p = photos[i], img = document.getElementById('photo');
            img.width = p[1]; img.height = p[2]; img.alt = p[3]; img.src = 'photos/' + p[0];
        })();
