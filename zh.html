        .card { position: relative; background: #fff; border: 1px solid #e0e0e0; width: min(920px, 100%); height: 620px; padding: 64px 72px; display: flex; flex-direction: row-reverse; justify-content: space-between; align-items: stretch; }

        .title { display: flex; flex-direction: row-reverse; gap: 20px; align-items: flex-start; }

        .title .k { font-size: 20px; letter-spacing: .5em; color: #333; }
        /* The index is set like a book's table of contents: one entry per column, read right to left */
        nav { writing-mode: vertical-rl; align-self: center; height: 300px; }
        nav a { display: block; letter-spacing: .45em; }
        nav .m { font-size: 19px; color: #000; margin-left: 16px; }
        nav .s { font-size: 17px; color: #666; margin-left: 10px; padding-top: 2.6em; }

        .name { writing-mode: vertical-rl; font-size: 19px; letter-spacing: .6em; color: #333; }
        .year { writing-mode: vertical-rl; font-size: 15px; letter-spacing: .25em; color: #333; }
        /* 手机：宋代题跋册页的章法，用现代字体重新解释。
           标题居右、独立，略高于正文（抬头）；正文各列齐头不齐脚，列距匀净；
           落款一列小字，起首低于正文，止于正文末字之上；文字聚于右，左侧留白。 */
        /* Short landscape screens (phones turned sideways): the same poster, scaled down to fit the screen height */
        @media (min-width: 641px) and (max-height: 560px) {
            body { padding: 16px 20px; }
            .card { height: max(330px, calc(100vh - 32px)); padding: 32px 48px; }

            .title .k { font-size: 14px; }
            nav { height: 190px; }
            nav .m { font-size: 14px; margin-left: 10px; }
            nav .s { font-size: 12.5px; margin-left: 7px; }
            nav .g + .g .m { margin-right: 22px; }
            .foot { gap: 14px; }
            .name { font-size: 14px; }
            .year { font-size: 12px; }
            .lang { right: 48.5px; bottom: 37.5px; font-size: 11px; }
        }
        @media (max-width: 640px) {
            body { padding: 52px 12px 24px; align-items: flex-start; }
            /* 内容在框内左右居中 */
            .card { height: auto; padding: 64px 26px 56px; display: flex; flex-direction: row-reverse; justify-content: center; align-items: flex-start; }
            .title { display: contents; }
            .title .k { font-size: 16px; letter-spacing: .5em; color: #111; margin-left: 10px; }
            .title h1 { font-size: 36px; letter-spacing: .4em; margin-left: 38px; }
            nav { writing-mode: vertical-rl; align-self: flex-start; height: auto; margin-top: 72px; }
            /* 两列：关系接在元素之下，习作接在对比之下 */
            nav { line-height: 1; }
            nav .g:nth-child(2)::after { line-height: 3.4; }
            nav .g { display: inline; margin: 0; }
            nav .g:nth-child(2)::after { content: '\A'; white-space: pre; }
            nav .g:nth-child(2) .m, nav .g:nth-child(4) .m { margin-top: 2em; }
            nav a, nav .m, nav .s { display: inline; margin-left: 0; margin-right: 0; padding: 0; }
            nav .g:nth-child(odd) .m { margin-top: 0; }
            nav .m { font-size: 16px; letter-spacing: .32em; color: #111; }
            nav .m::after { content: ''; display: inline-block; block-size: .8em; }
            nav .s { font-size: 13.5px; letter-spacing: .26em; color: #777; }
            nav .s + .s { margin-top: .5em; }
            /* 落款：干支纪年与「关于」上缘对齐，姓名与正文末字对齐 */
            .foot { display: flex; flex-direction: row; justify-content: space-between; align-self: stretch; gap: 16px; margin-right: 32px; margin-top: 0; }
            /* 卡片保留细框，整体居中于屏幕 */
            body { align-items: center; padding: 24px 12px; }
            .lang { right: calc(50% - 129.4px); bottom: 56.5px; }
            .year, .name { display: inline; }
            .year { font-size: 12px; letter-spacing: .12em; color: #8a8a8a; }
            .name { display: block; font-size: 13px; letter-spacing: .3em; color: #333; margin: 0; }
            .year { display: block; }
        }
