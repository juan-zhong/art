    <style>
        /* iOS Safari enlarges text in landscape unless told not to; that pushed 析 into a second column */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        /* Page-specific styles (shared typography lives in styles.css) */
        main h2, main h3, header { text-align: center; }
        main h3 .zh { display: block; margin-top: 6px; }
        main h2 .num { display: block; margin-bottom: 6px; }
        main h2 .zh { display: block; margin-top: 8px; font-size: 0.6em; }
        main h3 { margin: 64px 0 28px; }
        main h2 + h3 { margin-top: 0; }
        figure { margin: 0 0 56px; text-align: center; }
        /* Each photo carries its own size (width/height, --w, --r), so the page reserves the right space before images load
           and nav jumps land exactly. Displayed size is unchanged: never wider than the photo, the column, or 85% of the screen height. */
        figure img { display: block; margin: 0 auto; width: min(var(--w, 100%), 100%, calc(85vh * var(--r, 1))); height: auto; cursor: zoom-in; }
        .lightbox { position: fixed; inset: 0; background: rgba(253,253,253,.97); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 64px; z-index: 200; }
        .lightbox.open { display: flex; }
        .lightbox img { max-width: 100%; max-height: calc(100vh - 140px); width: auto; height: auto; }
        .lightbox p { margin: 18px 0 0; font-size: 14px; color: #777; letter-spacing: 0.12em; text-transform: uppercase; }
        .lightbox button { position: absolute; background: none; border: 0; font: inherit; font-size: 26px; color: #777; cursor: pointer; padding: 12px; }
        .lightbox button:hover { color: #000; }
        .lb-close { top: 12px; right: 16px; }
        .lb-prev { left: 8px; top: 50%; transform: translateY(-50%); }
        .lb-next { right: 8px; top: 50%; transform: translateY(-50%); }
        @media (max-width: 600px) { .lightbox { padding: 40px 12px; } .lb-prev, .lb-next { top: auto; bottom: 8px; transform: none; } }
        /* Chinese title in the self-hosted LXGW WenKai subset (same Kaiti look as the homepage name) */
        @font-face { font-family: 'LXGW WenKai Art'; src: url('fonts/lxgw-wenkai-art.woff2') format('woff2'); font-display: swap; }
        :root { --font-zh: 'LXGW WenKai Art', 'LXGW WenKai', 'Kaiti SC', 'STKaiti', 'Kaiti TC', serif; }
        /* Digits in Limelight; English in Optima; Chinese in LXGW WenKai */
        @font-face { font-family: 'Art Figures'; src: url('fonts/limelight-figures.woff2') format('woff2'); unicode-range: U+0030-0039; font-display: swap; }
        @font-face { font-family: 'Optima Fallback'; src: url('fonts/marcellus-latin-400-normal.woff2') format('woff2'); font-display: swap; }
        :root { --font: 'Art Figures', Optima, 'Optima Fallback', 'Kaiti SC', 'STKaiti', 'Kaiti TC', 'LXGW WenKai', serif; }
        header h1 a { color: inherit; }
        header .name-zh { margin-top: 10px; }
        /* Back to the two poster homes: the Chinese title leads to the Chinese home, the English title to the English home */
        .home-links { display: flex; justify-content: center; align-items: baseline; flex-wrap: wrap; gap: 6px 22px; padding: 22px 16px 0; color: #999; }
        .home-links a { color: #999; text-decoration: none; text-transform: none; margin: 0; }
        .home-links a:hover { color: #000; }
        .home-links .zh { font-family: var(--font-zh); font-size: 13px; letter-spacing: .25em; }
        .home-links .en { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    </style>

    <script>
        (function () {
            var b = document.getElementById('toTop');
            function f() { b.classList.toggle('show', window.scrollY > 600); }
            window.addEventListener('scroll', f, { passive: true }); f();
            b.addEventListener('click', function (e) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

            var imgs = Array.prototype.slice.call(document.querySelectorAll('main figure img'));
            var lb = document.getElementById('lightbox'), big = lb.querySelector('img'), cap = lb.querySelector('p'), i = 0, last = null;
            function show(n) {
                i = (n + imgs.length) % imgs.length;
                big.src = imgs[i].src; big.alt = imgs[i].alt;
                var c = imgs[i].getAttribute('data-caption') || '';
                cap.textContent = c === '—' ? '' : c;
            }
            function open(n) { last = document.activeElement; show(n); lb.classList.add('open'); document.body.style.overflow = 'hidden'; lb.querySelector('.lb-close').focus(); }
            function close() { lb.classList.remove('open'); document.body.style.overflow = ''; if (last) last.focus(); }
            imgs.forEach(function (im, n) {
                im.tabIndex = 0;
                im.addEventListener('click', function () { open(n); });
                im.addEventListener('keydown', function (e) { if (e.key === 'Enter') open(n); });
            });
            lb.querySelector('.lb-close').addEventListener('click', close);
            lb.querySelector('.lb-prev').addEventListener('click', function () { show(i - 1); });
            lb.querySelector('.lb-next').addEventListener('click', function () { show(i + 1); });
            lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
            document.addEventListener('keydown', function (e) {
                if (!lb.classList.contains('open')) return;
                if (e.key === 'Escape') close();
                else if (e.key === 'ArrowLeft') show(i - 1);
                else if (e.key === 'ArrowRight') show(i + 1);
            });
        })();
    </script>
